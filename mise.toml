# C'est ICI, et nulle part ailleurs, que la technologie du projet est déclarée.
# AGENTS.md, la CI et les agents appellent tous `mise run <tâche>`.

[tools]
gitleaks = "8.30.1"
# Node 24 : LTS active en 2026, supportee jusqu en 2028.
# La 20 est en fin de vie depuis avril 2026 — inacceptable pour un socle
# dont la porte securite bloque sur les vulnerabilites (ADR-002).
# Exigence de vitest 5 : ^22.12 || ^24 || >=26.
node = "24"
osv-scanner = "2.5.1"

[tasks.setup]
description = "Installer les dépendances"
run = "npm ci || npm install"

[tasks.build]
run = "npm run build"

[tasks.test]
description = "Suite complète"
run = "npm run test"

[tasks.lint]
run = "npm run lint"

[tasks.typecheck]
run = "npm run typecheck"

[tasks.security]
description = "Secrets (gitleaks) et vulnerabilites connues (OSV)"
run = """
set -eu
# npm audit retire le 2026-09-04 : son point d'acces pend (>60 s) alors que
# npm ping repond en 400 ms. osv-scanner couvre le meme terrain, en local,
# a partir du lockfile, et agrege les avis npm.

echo "— recherche de secrets (historique Git) —"
gitleaks git . --no-banner --redact

echo "— vulnerabilites connues des dependances (OSV) —"
osv-scanner scan source -r .

echo "Controles de securite : OK"
"""

[tasks.verify]
description = "Toutes les portes de qualité, dans l'ordre de la constitution"
depends = ["lint", "typecheck", "test", "security"]
